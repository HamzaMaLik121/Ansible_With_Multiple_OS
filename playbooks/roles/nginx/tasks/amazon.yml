---
- name: Install nginx on Amazon Linux
  ansible.builtin.dnf:
    name: nginx
    state: present
  when: ansible_distribution_major_version | int >= 2

- name: Install nginx on Amazon Linux (yum fallback)
  ansible.builtin.yum:
    name: nginx
    state: present
  when: ansible_distribution_major_version | int < 2

- name: Ensure nginx service is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
